[package]
name = "golive-app"
version = "0.7.21"
edition = "2021"
default-run = "goDrinking"
license = "PolyForm-Noncommercial-1.0.0"
description = "goDrinking thin Tauri shell over golive-core. No product logic: commands drive the core, core events become Tauri events."

[lib]
name = "golive_app"
crate-type = ["rlib"]

[features]
video-helper-bin = []

[[bin]]
name = "goDrinking"
path = "src/main.rs"

[[bin]]
name = "golive-video"
path = "src/bin/video.rs"
required-features = ["video-helper-bin"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The core MUST NOT depend on Tauri; the shell depends on the core by path.
golive-core = { path = "../core" }
# Capture platform abstraction (pure trait/types; core never imports this).
golive-platform = { path = "../platform" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Share-modal thumbnails: PNG encode + data-URL base64 (offline-safe: both
# already in the workspace lockfile via tauri).
base64 = "0.22"
png = "0.17"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
# Native video windows (helper process owns the main-thread event loop;
# Tauri owns main in the app process). softbuffer = CPU blit, no GPU APIs,
# no extra dylibs — trivially packable.
winit = "0.30"
softbuffer = "0.4"
cpal = "0.15"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net"] }
ureq = { version = "3", features = ["json"] }
# Integration tests name capture kinds (camera contention flow).
golive-platform = { path = "../platform" }

# macOS capture backend (ScreenCaptureKit). Target-gated: other platforms
# build the shell without it (capabilities report accordingly).
[target.'cfg(target_os = "macos")'.dependencies]
golive-platform-macos = { path = "../platform-macos" }

# Windows capture backend (DXGI/WGC stub today). Target-gated, mirroring
# the macOS backend above: other platforms build without it.
[target.'cfg(target_os = "windows")'.dependencies]
golive-platform-windows = { path = "../platform-windows" }

# RGBA conversion is on the live receive path; unoptimized OpenH264 misses
# the 720p30 frame budget even when native decoding is fast.
[profile.dev.package.openh264]
opt-level = 3
