[package]
name = "golive-platform-macos"
version = "0.7.5"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
description = "goDrinking macOS capture backend (ScreenCaptureKit + webcam). macOS only; the pure contract lives in golive-platform."

[lib]
name = "golive_platform_macos"
crate-type = ["rlib"]

[dependencies]
golive-platform = { path = "../platform" }
# Pure ObjC bindings (no Swift toolchain, no extra link hacks): only system
# frameworks at runtime, which every Mac has. Versions pinned to the 0.3 line.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSError",
    "NSString",
    "NSValue",
    "NSUUID",
    "NSProcessInfo",
    "NSOperation",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "NSWorkspace",
    "NSRunningApplication",
] }
core-foundation = "0.10"
opus = "0.3"
objc2-core-media = "0.3"
# CVPixelBufferIOSurface for the zero-copy backing check (offline-safe:
# objc2-io-surface is already in the lockfile via the default set).
# The direct dep enables its `objc2` cargo feature, which the generated
# getter needs (weak-dep `?` does not turn it on by itself).
objc2-core-video = { version = "0.3", features = ["objc2-io-surface"] }
objc2-io-surface = { version = "0.3", features = ["objc2"] }
objc2-screen-capture-kit = "0.3"
# One-shot stills for the share-modal preview (CGWindowListCreateImage +
# pixel readout; offline-safe: already in the workspace lockfile).
objc2-core-graphics = { version = "0.3", features = [
    "CGWindow",
    "CGImage",
    "CGGeometry",
    "CGDataProvider",
    "CGDirectDisplay",
] }
block2 = "0.6"
dispatch2 = { version = "0.3", features = ["objc2"] }

objc2-core-foundation = "0.3"
objc2-video-toolbox = "0.3"
libc = "0.2"
# Webcam capture is a native AVFoundation delegate pipeline. Keep the session
# and every AVFoundation object on its owner thread; only copied BGRA crosses
# the callback boundary.
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "AVCaptureDevice",
    "AVCaptureInput",
    "AVCaptureOutputBase",
    "AVCaptureSession",
    "AVCaptureSessionPreset",
    "AVCaptureVideoDataOutput",
    "AVMediaFormat",
    "block2",
    "dispatch2",
    "objc2-core-media",
    "objc2-core-video",
] }

[dev-dependencies]
openh264 = "0.9"
